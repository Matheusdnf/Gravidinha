version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gravidinha_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gravidinha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./esquema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
